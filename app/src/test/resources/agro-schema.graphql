}

"""
The schema roots, merged from one object per subject.

`MergedObject` lets each subject's resolvers live in their own file — under `schema/`, or in a
`schema_*` file beside this one — without becoming a separate top-level field that clients would
have to reach through.
"""
type Query {
	health: String!
	"""
	Every account on the server. Administrators only — this is the guest list, and a guest
	enumerating the other guests is the first step of anything else they might try.
	"""
	users: [AccountPayload!]!
	"""
	Looks an account up. **Does not create one** — it used to, through `get_or_create_user`,
	which made a read-only-looking query mint accounts as a side effect: opening the dashboard
	recreated a deleted account, with a new passphrase, and closed the first-run setup window
	behind it. Accounts come from `createAccount` and nowhere else.
	The caller's own account. `username` is optional and defaults to whoever is asking.
	
	It has to be optional, because a client's first question is "who am I?" and it cannot name
	itself to ask. The dashboard used to guess — it started from a hard-coded `alpha` and asked
	`me(username: "alpha")` — so signing in as anyone else produced a refused query, no
	correction, and a page that went on displaying somebody else's name.
	"""
	me(username: String): AccountPayload
	"""
	Everything this server holds about the caller, as a JSON string.
	
	Self-scoped like everything else — an administrator cannot use this to read someone's
	listening history, because `authorize` compares the caller to the named account and an admin
	is not exempt from it.
	"""
	exportMyData(userId: String!): String!
	appPasswords(userId: String!): [AppPassword!]!
	"""
	Where the account left off.
	
	`excludeDevice` asks the question a client asks about *the rest of* its fleet: give me the
	latest session that is not mine. Optional, so a client that only wants "where was I" —
	which is most of them — is unchanged.
	"""
	playbackHandoff(userId: String!, excludeDevice: String): HandoffState
	"""
	Every content hash a device has reported, for reconciling against what it actually holds.
	"""
	deviceHoldings(userId: String!, deviceId: String!): [String!]!
	"""
	Tracks this device could delete without losing them: the server holds a filed copy.
	
	Both the index *and* the disk are consulted. An `archived_path` pointing at a file that is
	no longer there would otherwise talk a device into deleting its only copy — the index is a
	record of what this server did, not proof of what is on the disk now.
	
	The size is checked rather than the hash. Re-hashing every candidate would read the whole
	library on every call; a size mismatch catches the truncated and half-restored cases, and
	the bytes were already verified against the declared hash when they were archived.
	"""
	reclaimable(userId: String!, deviceId: String!, limit: Int): [LibraryTrackPayload!]!
	"""
	The account's library, page by page, for looking at rather than syncing.
	
	`deviceId` picks whose shelf is being compared against: every item comes back with
	`presentOnDevice`, which is what lets the view grey out what that device is missing. Omit it
	and everything reads as present, because there is nothing to be missing from.
	"""
	libraryBrowse(userId: String!, kind: LibraryBrowseKind!, deviceId: String, search: String, limit: Int, offset: Int): [LibraryItem!]!
	"""
	The album `id` (as `libraryBrowse` hands it out) in `userId`'s library. Who may look is the
	same as for `libraryBrowse`; null when the library holds none of it.
	"""
	libraryAlbum(userId: String!, id: String!): LibraryAlbumPayload
	"""
	How much this account's library holds, and how much of it the server has the bytes for.
	"""
	libraryStats(userId: String!): LibraryStatsPayload!
	"""
	What this account has used of its storage allowance.
	
	Derived from `effective_quota` and `spool_bytes_for` — the same two the upload path checks
	against — so the bar a client draws cannot disagree with the answer an upload gets.
	"""
	storageUsage(userId: String!): StorageUsagePayload!
	"""
	Looks up the target URL for a short link UID.
	
	Authenticated: the public half of this lives at `/listen`, which is the capability URL
	people without an account open. This resolver is the dashboard's, and took no token, so any
	caller could walk other accounts' links.
	"""
	resolveShortLink(id: String!): String
	"""
	Every link this account has minted, newest first.
	
	Both mechanisms in one list: the user made "a link", and which table it landed in is an
	implementation detail they should not have to know to find it again.
	"""
	links(userId: String!): [ShareLink!]!
	activeNodes(userId: String!): [NodePayload!]!
	"""
	The plugin registry. Administrators only, and described from the caller's own account:
	`plugin_context` used to read whichever account owned the first registered node, so this
	answered with a stranger's settings.
	"""
	plugins: [AgroPlugin!]!
	"""
	Which server features are on, for any signed-in account.
	
	Clients read this to hide what the operator has switched off, rather than offering a screen
	whose every call will be refused with `FEATURE_DISABLED`.
	"""
	serverFeatures: [ServerFeature!]!
	"""
	The SSO identities linked to an account. Self-scoped.
	"""
	federatedIdentities(userId: String!): [FederatedIdentity!]!
	"""
	The security log for one account, or — for an administrator passing no `userId` — the whole
	server.
	
	Self-scoped through `authorize`, so this is not a way to read anyone else's sign-in history:
	naming another account is refused exactly as it is everywhere else. The server-wide view is
	separately gated on `require_admin`, because "no `userId`" must not read as "any user".
	"""
	securityEvents(userId: String, limit: Int): [SecurityEventPayload!]!
	syncedSettings(userId: String!): SyncedSettingsPayload
	"""
	The account's listening, aggregated across every device that reports to it.
	
	`period` is DAY, WEEK, MONTH, YEAR or ALL. `deviceName` narrows it to one device's plays,
	which is how a client answers "what did *I* listen to" while still holding the fleet total.
	"""
	listeningStats(userId: String!, period: String, deviceName: String): ListeningStats!
	"""
	Computes a private Year / Month in Review recap for the account.
	
	`utc_offset_minutes` is the listener's offset from UTC. It defaults to zero, which is what
	this query did before the argument existed, so an older client keeps the answer it used to
	get. A recap that omits it buckets by UTC hours and days — see [`crate::stats_wrapped`] for
	why that is wrong for everyone who does not live on the meridian.
	"""
	agroWrapped(userId: String!, year: Int!, month: Int, utcOffsetMinutes: Int): AgroWrappedPayload!
	"""
	Tracks another of this account's devices holds that this one does not.
	
	Matched on the recording rather than the bytes, so owning a different rip of the same song
	counts as having it — see `Db::missing_on_device`.
	"""
	missingOnDevice(userId: String!, deviceId: String!, limit: Int): [LibraryTrackPayload!]!
	"""
	How this account should sync — the one answer both clients branch on.
	
	Derived rather than configured: a deployment that archives and has a music-server address on
	file is a streaming setup whether or not anyone said so, and a deployment with no library
	root cannot be anything but index-only.
	"""
	syncMode(userId: String!): SyncMode!
	"""
	Whether the signed-in account is currently quiet.
	
	Only ever answered for the caller. There is deliberately no version of this question about
	somebody else: an incognito account is not returned to anyone at all, and saying "they have
	gone quiet" would be exactly the disclosure incognito exists to prevent. A friend meets the
	same refusal a stranger does.
	
	Needed because [`Mutation::set_incognito`] returns the new value but nothing could *read*
	it — a client that has just launched has no way to learn the account is already quiet, and
	would carry on recording until someone touched the switch.
	"""
	incognito: Boolean!
	"""
	The state of the caller's second factor.
	"""
	totpStatus: TotpStatus!
	"""
	Whether the signed-in account has active 2FA / TOTP configured.
	"""
	hasTotp: Boolean!
	"""
	One account, as the caller is allowed to see it.
	
	Not gated by [`require_visible`]: the card itself — name, bio, avatar — is what someone
	needs in order to decide whether to send a request, so it is readable by any signed-in
	account for any discoverable or already-connected profile. What the flags gate is the
	*contents*: now playing and stats have their own resolvers and their own checks.
	"""
	profile(username: String!): ProfilePayload
	"""
	Every identity key `username` has published, one per device.
	
	Gated on friendship with the same refusal `dropTrack` uses, and for the same reason: a key
	list that answered differently for a stranger and for an account that does not exist would
	be a way to probe for accounts. Reading your own list is always allowed — a client needs it
	to seal a copy to its own other devices.
	
	A sender seals one copy per entry here. An account with no entries is one whose devices
	have never published a key, and the caller should fall back to sending the note in clear or
	not at all — never to sealing it to nobody.
	"""
	deviceKeys(username: String!): [DeviceKeyPayload!]!
	"""
	The public directory. Only accounts that asked to be listed appear in it.
	"""
	searchUsers(query: String!, limit: Int): [ProfilePayload!]!
	"""
	Accounts waiting to be let in. The approval queue, for the dashboard.
	"""
	pendingAccounts: [ProfilePayload!]!
	invites: [InvitePayload!]!
	"""
	Accepted friends, each with what they are playing when they allow that to be seen.
	`device_id` carries the same meaning it does on [`Self::friends_now_playing`]: the sealed
	copy of a session is addressed to one device's key, so it can only be picked once the asking
	device is named.
	
	It matters here and not only there because this query *seeds the presence feed* — a client
	refreshing the graph gets each friend's session in the same answer. Without a device id the
	sessions in that answer are placeholders, and a sealed friend would show as "Private
	Session" from every foreground refresh until a socket frame happened to replace it.
	"""
	friends(deviceId: String): [FriendEdgePayload!]!
	"""
	Requests in both directions: ones to answer, and ones already sent.
	"""
	friendRequests: [ProfilePayload!]!
	"""
	Just the presence feed: friends who are playing something and allow it to be seen.
	
	`device_id` names the device asking, so a friend running a sealed session can be handed the
	copy sealed to that device's key. It is optional because the device token does not carry
	one — the id is chosen by the client and published to the key registry — and because the
	dashboard has no device key to open a copy with. Omitting it costs nothing but the sealed
	metadata, which an asker with no key could not have read anyway.
	"""
	friendsNowPlaying(deviceId: String): [FriendNowPlaying!]!
	"""
	How much the caller's listening overlaps a friend's. Gated on the friend's stats flag.
	"""
	tasteMatch(username: String!): TasteMatch!
	"""
	Who the caller is currently tuned in to, if anyone.
	
	`device_id` serves the same purpose as it does on `friends_now_playing`: following a sealed
	session means being handed the copy sealed to this device, or the placeholder.
	"""
	listenAlong(deviceId: String): ListenAlongPayload
	"""
	Jams your friends have opened up, so one can be joined without being handed a code.
	
	Friendship and the switch, both — the same rule everything else social here follows.
	"""
	friendJams: [FriendJamPayload!]!
	"""
	The jam this account is in, or null. There is at most one.
	"""
	jam: JamPayload
	"""
	Your recaps of jams you have left, newest first.
	"""
	jamRecaps: [JamRecapPayload!]!
	"""
	One blend you are in, with its recipe and members. Rewritten first if it is due.
	"""
	blend(playlistId: String!): BlendPayload!
	"""
	Blends you have been asked to and not answered.
	"""
	blendInvites: [BlendPayload!]!
	"""
	Your backups, newest first.
	"""
	vaultBackups: [VaultBackupPayload!]!
	"""
	Your sealed vault key, or null before any device has enrolled one.
	
	For a device that signed in without the passphrase — by pairing QR or device token — and so
	never received the envelope login hands out. It asks the user for the passphrase and unwraps
	this on the device; the server learns nothing it did not have, and no new sign-in is minted.
	
	Not behind the backups switch: the same key seals synced settings. What it hands a stolen
	token is an Argon2id-wrapped key, as a stolen database already holds.
	"""
	vaultKeyEnvelope: VaultKeyEnvelope
	vaultLimits: VaultLimits!
	"""
	What the caller's friends have been into lately.
	
	Only friends who have opened `showActivity` appear. Anyone else is not merely omitted from
	the list — nothing about them is read at all.
	"""
	friendActivity(days: Int, limit: Int): [FeedItemPayload!]!
	"""
	The circle's shared recap: one anthem, one trendsetter, and how everyone's taste lines up.
	
	Gated on `Surface::Stats` rather than `Surface::Activity`. A recap reports totals and
	overlaps, which is the same kind of disclosure the statistics page already makes, and asking
	people to open a second switch for it would mean an empty recap for everyone who had
	already said yes to the first.
	
	`year` overrides `period` with a **calendar** year read in `utc_offset_minutes`, which is
	what Agro Replay asks for. `period: "YEAR"` cannot serve that: it means the last 365 days,
	so a recap of 2026 opened in February would be half about 2027.
	"""
	circleRecap(period: String, year: Int, utcOffsetMinutes: Int): CircleRecapPayload!
	"""
	What has been sent to the caller. Self-only; there is no argument for whose inbox to read.
	"""
	inbox(limit: Int, offset: Int): [DropPayload!]!
	"""
	What the caller has sent, as their own record of it.
	"""
	sentDrops(limit: Int, offset: Int): [DropPayload!]!
	"""
	The whole exchange with one other account, oldest first, both directions in one list.
	
	This is what makes a conversation rather than a mailbox. `inbox` and `sentDrops` are two
	halves of the same exchange split by direction, which is the wrong seam: what someone
	wants to see is everything they and one friend have handed each other, in order.
	
	The sender-side blanking of `read_at` still applies, per message. A thread must not become
	a way around the rule that you cannot see whether your own messages have been opened.
	
	Archived drops are included: archiving clears the inbox, and a record with half of it
	missing would be a record that lies.
	"""
	conversation(with: String!, limit: Int): [DropPayload!]!
	"""
	The number a badge shows.
	"""
	unreadDropCount: Int!
	"""
	Lists the playlists the caller can open and find: their own, every public one on the
	server, and the friends-only ones their accepted friends have shared. A private playlist
	is never listed for anyone but its owner.
	"""
	playlists: [PlaylistPayload!]!
	"""
	Fetches a single playlist by ID if the caller may open it: they own it, it is public, or it
	is friends-only and they are an accepted friend of its owner.
	"""
	playlist(id: String!): PlaylistPayload!
	"""
	The current revision of each of `ids` the caller may open, so a client holding copies can
	tell which have changed without downloading any of them.
	"""
	playlistRevisions(ids: [String!]!): [PlaylistRevision!]!
	followedPlaylists: FollowedPlaylists!
	"""
	Everything the catalogue learned after [`since`], oldest first.
	
	The client keeps the highest `updated_at` it has seen and passes it back. Re-reading an
	entry it already holds is harmless: these are facts about audio, so a client that sees one
	twice simply agrees with itself.
	"""
	catalogSince(since: Int!, limit: Int! = 200): [CatalogEntry!]!
	"""
	The recording a source id is known to hold, for a client resolving a shared link.
	"""
	recordingForSource(sourceUri: String!): String
	"""
	Who this account follows.
	"""
	subscribedArtists(userId: String!): [ArtistSubscription!]!
	"""
	Whether this account follows the artist of a given name.
	
	For a page that has a name and no id — which is every artist page opened from a track.
	"""
	isSubscribedToArtist(userId: String!, artist: String!): Boolean!
	"""
	Releases by followed artists published after [`since`], oldest first.
	
	Oldest first because the client walks forward from a stored watermark. Newest-first would
	mean a client that had been away announced only the most recent release and silently
	skipped everything before it.
	"""
	newReleases(userId: String!, since: Int!, limit: Int! = 100): [ArtistRelease!]!
	"""
	What the fleet has been playing over a rolling window, most played first.
	
	Authenticated but not scoped to the caller — like the catalogue, this is the fleet's shared
	view and holds nothing about who listened to what. Recordings below the exposure floor are
	absent rather than zeroed, so a caller cannot learn that something was played a little by
	noticing a row with a small number on it.
	"""
	popularTracks(days: Int! = 7, limit: Int! = 20): [PopularTrackEntry!]!
	"""
	The recordings that sound nearest to this one, nearest first.
	
	Empty when nobody has measured the seed. That is the honest answer and it is deliberately
	not softened by falling back to the best-measured or most-played recordings: a "similar
	tracks" endpoint that answers something when it knows nothing is how a recommender collapses
	onto whatever is already popular.
	
	Callers are expected to treat these as *candidates to rank*, not as a queue. The client
	holds a share of every radio queue for music nothing has measured, which is what keeps new
	recordings reachable at all — this index can only ever speak about what it has been told.
	"""
	similarRecordings(artist: String!, title: String!, limit: Int! = 20): [SimilarTrackEntry!]!
	"""
	How the caller's listening year compares with everybody else's on this server.
	
	Takes no `userId`. That is the whole design: a `userId` argument would need a visibility
	check, and "what percentile is my friend in" is a question nobody asked to have answered
	about them. The caller can only ever ask about themselves.
	
	Answers `suppressed` on a server with fewer than [`crate::db_replay::MIN_COHORT`] listeners
	that year, where a ranking would describe identifiable people rather than a crowd.
	"""
	replayChartStanding(year: Int!, utcOffsetMinutes: Int): ReplayChartStanding!
}

"""
Who queued the most of what was played.
"""
type RecapContributor {
	username: String!
	tracks: Int!
}

"""
One track the room heard, with the reaction it got.
"""
type RecapTrack {
	title: String!
	artist: String!
	artworkUrl: String
	trackUri: String!
	addedBy: String!
	durationMs: Int!
	"""
	Approvals from people other than whoever proposed it.
	"""
	approvals: Int!
	skipVotes: Int!
}

"""
What one call to `reindexNormalisation` rewrote.
"""
type ReindexPayload {
	"""
	`library_tracks` rows brought up to date this call.
	"""
	tracks: Int!
	"""
	`playlist_items` rows brought up to date this call.
	"""
	playlistItems: Int!
	"""
	False means stale rows remain — call again with the same batch size.
	"""
	done: Boolean!
}

"""
Where the caller's year sits among everyone else's on this server.
"""
type ReplayChartStanding {
	"""
	0–100: the share of the cohort that listened less than the caller.
	"""
	percentile: Int!
	"""
	How many accounts were ranked.
	"""
	cohortSize: Int!
	"""
	The caller's own minutes, so the card can say what the percentile is of.
	"""
	minutes: Int!
	"""
	True when this server has too few listeners to rank anyone without describing them.
	Everything else is zero; a client must draw nothing rather than "top 100%".
	"""
	suppressed: Boolean!
}

"""
One play a client is reporting.
"""
input ScrobbleInput {
	trackTitle: String!
	artistName: String!
	albumName: String
	genre: String
	durationSecs: Int!
	"""
	RFC3339, from the device. A phone that was offline is reporting yesterday's listening, and
	stamping it on arrival would pile a week of history onto one afternoon.
	
	Stored to the hour, not the second: see `Db::record_scrobbles`.
	"""
	playedAt: String!
	"""
	A per-play id from the client, which is what makes ingest idempotent now that the stored
	timestamp is too coarse to tell two plays of one track apart. Optional, for clients that
	predate it.
	"""
	playUid: String
}

"""
One entry in the security log.
"""
type SecurityEventPayload {
	id: Int!
	at: String!
	"""
	The account this concerns. Absent on a failed login for a username that does not exist.
	"""
	userId: String
	"""
	A stable machine-readable kind — see `audit::Event`.
	"""
	kind: String!
	"""
	The network the request came from, truncated to a /24 or /64. Never a full address.
	"""
	clientIp: String
	deviceLabel: String
	detail: String
}

"""
One switchable feature and whether it is on.
"""
type ServerFeature {
	id: String!
	enabled: Boolean!
}

"""
One link this account has minted, whichever of the two mechanisms produced it.
"""
type ShareLink {
	id: String!
	"""
	`SHORT` for `/listen?id=…`, `EPHEMERAL` for a hosted `/share/<token>` page.
	"""
	kind: String!
	"""
	Where the link goes: the forwarding target, or the hosted audio URL.
	"""
	target: String!
	"""
	The full address to hand out.
	"""
	url: String!
	"""
	What the link is of, when the row knows. Only ephemeral shares carry track metadata.
	"""
	label: String
	createdAt: Int
	expiresAt: Int
	"""
	How many times it has been opened. An aggregate and nothing else — see migration 6.
	"""
	clickCount: Int!
	lastClickedAt: Int
	"""
	Which backend minted the underlying share, when known. `"navidrome"` or `"subsonic"` matters at deletion.
	"""
	source: String
}

type SharePayload {
	token: String!
	shareUrl: String!
	expiresAt: String!
	trackTitle: String!
	artistName: String!
}

"""
One recording near the seed.
"""
type SimilarTrackEntry {
	title: String!
	artist: String!
	"""
	Acoustic distance. Smaller is nearer; zero means the two measured identically.
	"""
	distance: Float!
	"""
	How many independent measurements the average rests on.
	"""
	observations: Int!
}

"""
A named total: an artist, an album, a genre, a device.
"""
type StatEntry {
	name: String!
	"""
	Plays for the top-N lists; seconds for the per-device breakdown.
	"""
	value: Int!
}

"""
How much of an account's allowance is gone.

A separate field rather than two more columns on [`LibraryStatsPayload`], because it answers a
different question and is computed differently. `total_bytes` counts every archived track in
the deployment into every account's total, so it reads the same for a guest holding nothing as
for the admin — see `Db::spool_bytes_for`. The quota is enforced against the spool, so that is
what is reported here.

`quota_bytes` is null when the account is uncapped, which is not the same as a quota of zero:
the admin owns the disk, and a quota on them is theatre. Clients must show "no limit" for null
rather than a full bar.
"""
type StorageUsagePayload {
	usedBytes: Int!
	quotaBytes: Int
}

"""
How this deployment moves music between devices.

The clients used to decide this individually, from local config that knew nothing about the
server — which is why the same account could behave differently on the desktop and the phone.
The server holds every fact the decision needs, so it makes the decision and the clients
render it.
"""
enum SyncMode {
	"""
	A Subsonic-compatible server (Navidrome and the like) is configured for this account and
	the server archives. Devices do not need their own copies — they stream — so downloads
	are never offered and freeing space is always safe.
	"""
	NAVIDROME
	"""
	The server archives, but there is no music server to stream from. A device that lacks a
	recording is offered the file itself.
	"""
	PEER_TO_PEER
	"""
	No library root: the server keeps the index and relays through the spool, but never keeps
	the bytes. It cannot be the durable copy, so it never suggests deleting one.
	"""
	INDEX_ONLY
}

input SyncedSettingsInput {
	userId: String!
	"""
	Sealed by the client before it is sent. The server stores it without looking.
	"""
	settingsBlob: String
	hasServerUrl: Boolean
	lyricsFetchOnline: Boolean
	streamFormat: String
	shareDomain: String
	shareHosts: String
	shareEnabled: Boolean
}

type SyncedSettingsPayload {
	userId: String!
	"""
	The account's upstream settings, as the client sealed them. This server cannot read it and
	has no key to try: it is handed back exactly as it arrived.
	"""
	settingsBlob: String
	"""
	Whether the blob contains a server address, which is all `syncMode` ever needed to know.
	"""
	hasServerUrl: Boolean!
	lyricsFetchOnline: Boolean!
	streamFormat: String!
	"""
	The domain the players rewrite share links onto, e.g. `frwd.top`. Empty means they each
	share their backend's own link, which is also what happens with no Agro at all.
	"""
	shareDomain: String
	"""
	Comma-separated hosts `/listen` will forward to. The allowlist, in other words: without
	one, the route would be an open redirect wearing the user's domain.
	"""
	shareHosts: String
	shareEnabled: Boolean!
	updatedAt: String!
}

"""
How much two accounts' listening overlaps.
"""
type TasteMatch {
	"""
	0–100. See `taste_score` for what it actually measures.
	"""
	score: Int!
	sharedArtists: [StatEntry!]!
	sharedTracks: [StatEntry!]!
}

"""
One cell of the taste matrix. Undirected — `a` and `b` are sorted, and each pair appears once.
"""
type TasteMatrixEntry {
	a: String!
	b: String!
	score: Int!
}

"""
The recovery codes, returned once when enrolment is confirmed.
"""
type TotpConfirmedPayload {
	"""
	Ten single-use codes. The server keeps only their digests and cannot show these again.
	"""
	recoveryCodes: [String!]!
	"""
	How many device tokens were signed out by enrolling. See `confirmTotp`.
	"""
	devicesSignedOut: Int!
}

"""
What a client needs to finish enrolling a second factor. Shown once and never again.
"""
type TotpEnrolmentPayload {
	"""
	For the QR code.
	"""
	otpauthUri: String!
	"""
	For typing in by hand when the camera will not cooperate.
	"""
	secretBase32: String!
}

"""
The state of an account's second factor, for the settings screen.
"""
type TotpStatus {
	isEnabled: Boolean!
	"""
	Unused recovery codes left. Zero means the next lost phone is a lockout.
	"""
	recoveryCodesRemaining: Int!
	"""
	False when the server has no `AGRO_SECRET_KEY`, so enrolment cannot be offered at all.
	"""
	isAvailable: Boolean!
}

type TrendsetterPayload {
	username: String!
	"""
	How many of the circle's top tracks this account played before anybody else did.
	"""
	firsts: Int!
	"""
	A few of them, so the claim can be checked rather than merely asserted.
	"""
	examples: [String!]!
}

type VaultBackupPayload {
	id: String!
	createdAt: String!
	deviceId: String!
	deviceName: String
	appVersion: String
	format: Int!
	"""
	Before compression and sealing.
	"""
	plainBytes: Int!
	"""
	What is stored.
	"""
	sealedBytes: Int!
	sections: [VaultSection!]!
	"""
	Whether the device chose to include its sign-ins, so the dashboard can say so plainly.
	"""
	includesAccounts: Boolean!
	sha256: String!
}

"""
The account's vault key as the server keeps it: sealed under the passphrase, which it never has.
"""
type VaultKeyEnvelope {
	vaultSalt: String!
	vaultKeyWrapped: String!
}

"""
The rules a client shows, so it never has to hard-code them and disagree.
"""
type VaultLimits {
	keepPerAccount: Int!
	maxSealedBytes: Int!
}

"""
One section of a backup and how many records it held.
"""
type VaultSection {
	name: String!
	count: Int!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Indicates that an Input Object is a OneOf Input Object (and thus requires exactly one of its field be provided)
"""
directive @oneOf on INPUT_OBJECT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
