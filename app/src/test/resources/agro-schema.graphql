}

input MoveEditInput {
	itemId: String!
	"""
	Placed after this item; first when absent.
	"""
	afterItemId: String
}

type Mutation {
	"""
	Approves, suspends or restores an account.
	"""
	setAccountState(username: String!, state: String!): AccountPayload!
	"""
	Sets how much spool a guest may occupy, in bytes. `0` means unlimited.
	"""
	setAccountQuota(username: String!, quotaBytes: Int!): AccountPayload!
	"""
	Allows or disallows a user from permanently saving music into the server's archive.
	"""
	setCanArchive(username: String!, canArchive: Boolean!): AccountPayload!
	"""
	Deletes an account with its nodes, session, settings and app passwords.
	
	Irreversible, and it can lock you out: deleting the last account puts the server back into
	first-run, where anyone who can reach it may create the next one. The caller confirms.
	Removes an account and everything belonging to it.
	
	An administrator may remove anyone; anyone else may only remove themselves. Only the first
	half of that used to be true — the check was `authorize`, which compares the caller to the
	named account, so the admin could delete nobody but themselves and a guest account could
	never be got rid of at all.
	
	The last administrator is protected. Deleting them would leave a server whose accounts
	nobody can administer, and which no setup token can recover: one is only minted for a
	database with *no* accounts, and the guests would still be there.
	"""
	deleteAccount(username: String!): Boolean!
	"""
	Issues a credential for one client, so that client can be revoked on its own rather than
	by rotating the account passphrase every other device is using.
	"""
	createAppPassword(userId: String!, label: String!): AppPasswordCreated!
	"""
	Revokes one credential by the id `appPasswords` reported.
	
	Deliberately not by label. A label is a human note, chosen by the client and freely
	repeated — a client that re-logs in on every launch leaves a row each time, all of them
	named the same thing. Revoking by label signed out every one of them at once, which is
	precisely the opposite of the per-device revocation these credentials exist to provide.
	"""
	revokeAppPassword(userId: String!, id: Int!): Boolean!
	updateHandoff(input: HandoffInput!): Boolean!
	"""
	Records what a device holds.
	
	Batched and idempotent, so a client sends its whole library once and only deltas after —
	re-sending everything is wasteful but never wrong.
	
	Each entry also indexes the track, so the server knows about files it has never been sent.
	That is what makes index-only mode work: the diff needs metadata, not bytes.
	"""
	reportHoldings(userId: String!, deviceId: String!, tracks: [HoldingInput!]!): Int!
	"""
	Forgets holdings a device no longer has — deleted locally, or moved to the server and
	removed. The index entry survives: another device may still hold it.
	"""
	forgetHoldings(userId: String!, deviceId: String!, hashes: [String!]!): Int!
	"""
	Removes a track from the library entirely. It will disappear from all views.
	"""
	deleteLibraryItem(userId: String!, kind: LibraryBrowseKind!, id: String!): Boolean!
	"""
	Recomputes the normalised matching columns from the metadata already stored.
	
	The columns are derived in Rust at insert time, so changing `norm.rs` leaves every existing
	row on the old convention and no amount of SQL can repair them. This is the entry point that
	can — run it after any deploy that touches normalisation.
	
	Admin-only, and not because the data is sensitive: it is a write across the whole index, and
	nobody should be able to schedule that from an ordinary account. It reads nothing about who
	listened to what — these columns are facts about titles.
	
	Bounded per call. Keep calling while `done` is false.
	"""
	reindexNormalisation(batch: Int! = 500): ReindexPayload!
	"""
	Creates a short UID for a share URL. Returns the short link UID (e.g. "aB3x9Q"), or the
	account's existing open-ended link to the same target — see `db_short_links`.
	
	`source` records which backend minted the underlying share — `"navidrome"` or `"subsonic"` when the
	link points at a share on the music server, so deleting it later can also revoke it there.
	"""
	createShortLink(userId: String!, targetUrl: String!, source: String, expiresAt: Int): String!
	"""
	Removes a link so it stops resolving.
	
	`kind` is the discriminator from `links` — `SHORT` or `EPHEMERAL`. Deleting is scoped to the
	owning account inside the statement itself, so a link belonging to somebody else is a
	not-found rather than a deletion.
	"""
	deleteLink(userId: String!, id: String!, kind: String!): DeleteLinkPayload!
	createEphemeralShare(userId: String!, trackTitle: String!, artistName: String!, albumName: String, audioUrl: String!, ttlHours: Int): SharePayload!
	"""
	Looks a track's lyrics up at LRCLIB.
	
	Authenticated, and the inputs are bounded. This took no token at all and made an outbound
	HTTP request per call with strings the caller chose — an unauthenticated amplification
	primitive pointed at someone else's server.
	"""
	fetchLyricsAndCover(artist: String!, title: String!): LyricsAndCoverPayload!
	registerNode(userId: String!, deviceId: String!, clientType: String!, deviceName: String, lanAddress: String, version: String, currentTrack: String): NodePayload!
	unregisterNode(userId: String!, deviceId: String!): Boolean!
	"""
	Renames a device.
	
	Scoped to devices the caller owns. A name is what makes a device list usable, and until now
	the only way to change one was to make the client send a different `deviceName` — which for
	a name the *server* invented meant there was no way at all.
	"""
	renameNode(userId: String!, deviceId: String!, petname: String!): Boolean!
	"""
	Mints a device token and returns it as a scannable pairing payload.
	
	The pairing QR used to be built from the account passphrase, so photographing it once handed
	over the account permanently. Each scan now gets its own revocable credential, which is why
	this is a mutation: it creates something.
	"""
	pairDevice(userId: String!, label: String): PairingPayload!
	"""
	Enables or disables a plugin. Administrators only: `plugins_state` has no user column, so
	this writes server-global configuration and every account sees the result.
	"""
	togglePlugin(pluginId: String!, isEnabled: Boolean!): Boolean!
	"""
	Ingests a batch of plays from one device.
	
	Batched because clients hold an outbox and drain it when they next have a connection — a
	phone that spent a day on aeroplane mode sends a day of listening in one request. Idempotent
	on (account, artist, title, time), so a client unsure whether its last upload landed can
	simply send it again. Returns how many rows were genuinely new.
	"""
	recordScrobbles(userId: String!, deviceName: String!, clientType: String, entries: [ScrobbleInput!]!): Int!
	"""
	Purges listening history (scrobbles) for the account, optionally restricted by year or cutoff.
	
	Useful for wiping past listening data after viewing a Rewind or on demand.
	"""
	purgeScrobbles(userId: String!, year: Int, before: String): PurgeScrobblesPayload!
	"""
	Registers this account's vault key, sealed by the client under the account passphrase.
	
	The server takes two opaque strings and can do nothing with either: unwrapping needs the
	passphrase, and it keeps only an Argon2 hash of that. What it is storing is the means for
	the *user* to recover their settings on a new device, not the means for this machine to read
	them.
	
	Enrolment is once per account. A second attempt returns `false` rather than erroring —
	two devices racing to set up the same account is an ordinary thing to happen, and the loser
	should fetch the winner's envelope and unwrap it, not treat the race as a failure.
	"""
	enrolVaultKey(userId: String!, vaultSalt: String!, vaultKeyWrapped: String!): Boolean!
	"""
	Removes a linked SSO identity from the caller's account.
	
	Refuses when it would remove the last way in — an account created through SSO has a
	passphrase it has never been shown, so unlinking without setting one first is a lockout.
	"""
	unlinkFederatedIdentity(userId: String!, issuer: String!, subject: String!): Boolean!
	"""
	Changes the caller's passphrase, re-sealing the settings vault under the new one.
	
	The client does the sealing: it unwraps the vault key with the old passphrase, wraps it
	again with the new one, and sends both halves. The server never sees either passphrase in a
	form it could keep, and never sees the vault key at all — the same property the vault had
	before this mutation existed.
	
	**Every device is signed out, including the caller's.** A passphrase is changed because it
	may have leaked, and the tokens bought with it are the thing being invalidated.
	"""
	changePassphrase(userId: String!, currentPassphrase: String!, newPassphrase: String!, newVaultSalt: String, newVaultKeyWrapped: String): Boolean!
	"""
	Signs out every other device on the account.
	
	The blunt instrument that per-device revocation does not cover: a passphrase that may have
	leaked has already been traded for tokens, and revoking them one at a time from a list means
	noticing every one of them. This spares only the device making the call — by token hash, not
	by label, for the same reason `revokeAppPassword` refuses to work by label.
	
	Returns how many were revoked.
	"""
	revokeAllDevices(userId: String!): Int!
	updateSyncedSettings(input: SyncedSettingsInput!): SyncedSettingsPayload!
	"""
	Nudges one device to look at what it is missing.
	
	Addressed to that device alone rather than broadcast, so the other devices on the account
	are not prompted about a library that is not theirs.
	"""
	offerSync(userId: String!, deviceId: String!): Int!
	"""
	Edits the caller's own profile. Fields left out are left alone rather than blanked.
	"""
	updateProfile(displayName: String, bio: String, avatarUrl: String): ProfilePayload!
	"""
	Publishes or withdraws one device's identity key.
	
	`device_id` names which of the caller's devices this key belongs to, and only that entry is
	touched. Omitting it writes the `legacy` entry — which is what a client that predates the
	registry is doing whether it knows it or not, and it is the behaviour those clients already
	had: one key for the account.
	
	`users.public_key` is still written, because older clients read it and nothing else. It is
	last-writer-wins, so it will hold whichever device published most recently; that is
	tolerable now only because nothing that seals a note reads it any more.
	"""
	setPublicKey(publicKey: String, deviceId: String): ProfilePayload!
	"""
	The switches that decide what a friend can see, whether strangers can find you, and whether
	your plays feed the fleet-wide Popular on Agro chart.
	
	One mutation rather than one per switch, so the privacy screen writes what the user sees in
	a single round trip and cannot land half-applied. Each switch is optional and one left out is
	left alone.
	
	This matters more than it looks: the flags are independent decisions, and requiring all of
	them on every call means a client flipping one has to resend its idea of the rest. Two
	devices doing that concurrently silently undo each other — a switch turned on over here gets
	reverted by a stale copy sent from over there.
	"""
	setVisibility(showNowPlaying: Boolean, showStats: Boolean, discoverable: Boolean, shareLibrary: Boolean, showActivity: Boolean, popularOptIn: Boolean): ProfilePayload!
	"""
	Goes quiet, or stops being quiet.
	
	Its own mutation rather than a sixth flag on `set_visibility`, because it is a different
	kind of thing: the others are standing consents, this is a temporary override of all of
	them. Bundling it would mean leaving incognito had to restore the rest from a client's idea
	of what they were, and a stale copy would silently turn a privacy switch back on.
	
	The server is the authority. Every client reads this value rather than keeping its own, so
	one device going quiet takes the whole account quiet — a phone still announcing the account
	from a pocket is exactly the failure a device-local incognito has.
	"""
	setIncognito(incognito: Boolean!): Boolean!
	"""
	Begins enrolling a second factor for the caller.
	
	Writes a secret that is not yet binding: nothing enforces it until `confirmTotp` has seen a
	code computed from it. That ordering is deliberate — the failure mode of a second factor is
	always lockout, so the recoverable sequence is the only one on offer.
	"""
	beginTotp: TotpEnrolmentPayload!
	"""
	Confirms the pending enrolment with a code from the authenticator.
	
	**This signs out every other device**, and returns how many. Whoever held the passphrase
	before this moment has already traded it for tokens, and those tokens do not carry a second
	factor — leaving them alive would make enrolling change nothing for the attacker it is meant
	to shut out. The device doing the enrolling is spared, so the user is not signed out of the
	screen they are standing on.
	"""
	confirmTotp(code: String!): TotpConfirmedPayload!
	"""
	Turns the second factor off. Requires a current code, or a recovery code.
	
	The proof is the entire point. Without it, a stolen device token — which by construction did
	not pass a second factor — could remove the second factor, and the feature would protect
	nothing but itself. An administrator on a server that requires 2FA cannot disable it at all.
	"""
	disableTotp(code: String!): Boolean!
	"""
	Issues a fresh set of recovery codes, invalidating the old ones. Requires a current code.
	"""
	regenerateRecoveryCodes(code: String!): [String!]!
	"""
	Asks to be someone's friend.
	
	Answers `true` for a request that was recorded and `false` for one that was not, without
	saying which of the several reasons applied — an existing edge, a block, or no such account
	all look the same from here, and telling them apart would let this be used to probe for
	accounts that chose not to be listed.
	"""
	sendFriendRequest(username: String!): Boolean!
	acceptFriendRequest(username: String!): Boolean!
	"""
	Mints a short-lived code for adding the caller as a friend in person.
	
	For the case the username search cannot serve: two people in the same room, one of whom is
	not `discoverable` and should not have to become so just to be added once. The code stands
	in for the search, not for the consent — redeeming it still produces the same friend edge
	the ordinary flow does.
	
	Any previous code for this account is dropped when a new one is minted, so only the code
	currently on screen works. Clients are expected to re-mint every few minutes while the
	panel is open and to call `revokeFriendCode` when it closes.
	"""
	createFriendCode: FriendCodePayload!
	"""
	Drops the caller's outstanding code, for a panel being closed or the app going away.
	"""
	revokeFriendCode: Boolean!
	"""
	Spends a code and becomes friends with whoever minted it.
	
	Both directions at once, not a request to be accepted: the two people were standing
	together and one of them showed the other a screen, so the consent has already happened in
	a way a notification cannot improve on.
	
	Returns the username on success and null for every failure — unknown, expired, already
	spent, or the caller's own code. Distinguishing them would turn this into an oracle for
	which codes have existed.
	"""
	redeemFriendCode(code: String!): String
	"""
	Declines a request, or ends a friendship. The same operation on the data either way.
	"""
	removeFriend(username: String!): Boolean!
	blockUser(username: String!): Boolean!
	unblockUser(username: String!): Boolean!
	"""
	Tunes the caller in to a friend's playback.
	
	Gated on the host's now-playing flag, because following someone's playback is a strictly
	larger thing than seeing it, and there is no sensible reading in which the smaller one is
	closed and the larger one is open.
	"""
	startListenAlong(host: String!, deviceId: String): ListenAlongPayload!
	stopListenAlong: Boolean!
	createInvite(maxUses: Int, ttlHours: Int): InvitePayload!
	"""
	Deletes an invite outright.
	
	Revoking and deleting are different acts: revoking stops a code working the moment you
	realise it has escaped, and keeps the record. Deleting is the tidying-up afterwards, once a
	code is spent or dead and is only taking up room on screen.
	"""
	deleteInvite(code: String!): Boolean!
	revokeInvite(code: String!): Boolean!
	"""
	Opens a jam with this account as its host.
	
	Leaves whatever jam you were in first: being in two at once would make "the queue" and
	"your vote" ambiguous, and there is no interface in which that reads well.
	"""
	createJam(mode: String): JamPayload!
	"""
	Joins a jam by its code.
	"""
	joinJam(code: String!): JamPayload!
	"""
	Joins a friend's jam by its id, with no code.
	
	The code is not bypassed so much as unnecessary: the jam has been opened to friends, and
	this checks that you are one. A jam that has *not* been opened is refused in the same words
	as one that does not exist, so this cannot be used to discover rooms.
	"""
	joinFriendJam(jamId: String!): JamPayload!
	"""
	Opens the jam to friends, or shuts it back to code-only. The creator decides.
	"""
	setJamVisibility(visibility: String!): JamPayload!
	"""
	Leaves the jam, and deletes it once nobody is left.
	
	The creator leaving ends it for everyone — a room with no one to govern it cannot change
	mode or be wound up — and the rows go with it. A jam is a room, not a document: keeping a
	dead one means every client has to keep deciding whether it still counts.
	"""
	leaveJam: Boolean!
	"""
	Switches between `open` and `democracy`. Host only — it is the rule everyone else plays by.
	"""
	setJamMode(mode: String!): JamPayload!
	"""
	Votes to skip whatever is playing.
	
	One vote per person per track, and the votes die with the track — a skip is about *this*
	song, not a standing objection. Once more than half the room has asked, the track is retired
	immediately rather than at the end of its duration, and the clock takes the next one.
	"""
	voteSkipJamTrack: JamPayload!
	"""
	Suggests a track.
	
	In `open` mode it joins the queue immediately. In `democracy` it waits as a proposal until a
	majority of the *other* members accept it — which is what voting is for here. It sorts
	nothing: a track that has been accepted takes its place by when it was added, like any
	other.
	
	`durationMs` matters more than it looks: the server advances the room on that number, so a
	track without one would be skipped past the moment it started.
	"""
	addJamTrack(trackUri: String!, title: String!, artist: String!, artworkUrl: String, durationMs: Int, isLive: Boolean, deviceId: String, contentHash: String): JamPayload!
	"""
	Accepts somebody's suggestion.
	
	One-way, unlike the toggle this replaces. Taking an approval back could drop a track out of
	the queue after the room had already accepted it — possibly while it was playing — so
	somebody who changes their mind removes the track rather than un-approving it.
	
	Approving your own suggestion is accepted and recorded but never counts. The rule lives here
	rather than in each client's decision about whether to show a button.
	"""
	approveJamTrack(trackId: String!): JamPayload!
	"""
	Removes a track. Your own, or anyone's if you are the host.
	"""
	removeJamTrack(trackId: String!): JamPayload!
	"""
	Forgets one of your recaps. `false` when there was no such recap of yours.
	
	Not behind the jams switch: an operator turning jams off must not stop anyone deleting
	what is already kept about them.
	"""
	dismissJamRecap(id: String!): Boolean!
	"""
	Makes a blend of you and up to seven accepted friends, who are asked rather than added.
	"""
	createBlend(title: String!, members: [String!]!, size: Int!, mix: Int!, window: BlendWindow!, refresh: BlendRefresh!): BlendPayload!
	"""
	Joins or declines a blend you were asked to. `false` when there was no such invitation.
	"""
	answerBlendInvite(playlistId: String!, accept: Boolean!): Boolean!
	"""
	Leaves a blend; it is rewritten without you. Its creator leaving ends it for everyone.
	"""
	leaveBlend(playlistId: String!): Boolean!
	"""
	Changes a blend's title and recipe. Its creator only; it is rewritten at once.
	"""
	updateBlend(playlistId: String!, title: String!, size: Int!, mix: Int!, window: BlendWindow!, refresh: BlendRefresh!): BlendPayload!
	"""
	Deletes one of your backups. Not behind the feature switch: turning backups off must not
	stop anyone removing what is already kept.
	"""
	deleteVaultBackup(id: String!): Boolean!
	"""
	Hands a track to an accepted friend.
	
	Refuses with the same opaque error the rest of the social layer uses, for the same reason:
	"not your friend", "blocked you" and "no such account" must be indistinguishable, or this
	mutation becomes the account directory that `discoverable` exists to opt out of.
	"""
	dropTrack(to: String!, trackTitle: String!, artistName: String!, albumName: String, artworkUrl: String, contentHash: String, trackUri: String, note: String, noteCiphertext: String, noteCiphertexts: [DeviceCiphertextInput!], isEncrypted: Boolean): DropPayload!
	"""
	Reacts to a drop the caller received, replacing any reaction already on it.
	
	Recipient-only, enforced in the statement: reacting to your own message is not a thing, and
	allowing it would let a sender fabricate a response to themselves. A null or blank
	`emoji` clears the reaction, so tapping the same one twice undoes it.
	
	The emoji is stored as sent but capped in length. There is no allowlist: which characters
	count as "one emoji" is a moving target across Unicode versions and platforms, and a server
	that guesses would reject perfectly ordinary ones. The cap is what stops the field being
	used as a second, unrated message body.
	"""
	reactToDrop(id: String!, emoji: String): Boolean!
	"""
	Marks one of the caller's own drops read. A drop addressed to somebody else is a not-found.
	"""
	markDropRead(id: String!): Boolean!
	"""
	Takes a drop out of the inbox. The row survives, so the sender's record of having sent it
	does too.
	"""
	archiveDrop(id: String!): Boolean!
	"""
	Creates a new source-agnostic playlist.
	"""
	createPlaylist(title: String!, description: String, isPublic: Boolean, visibility: PlaylistVisibility): PlaylistPayload!
	"""
	Adds an abstract track to the end of a playlist. Owner only, and not revision-checked: this
	is how a playlist is first filled. Anyone else edits through `applyPlaylistEdits`.
	"""
	addTrackToPlaylist(playlistId: String!, track: PlaylistTrackInput!): PlaylistItemPayload!
	"""
	Removes a track from a playlist by item ID. Owner only; see `addTrackToPlaylist`.
	"""
	removeTrackFromPlaylist(playlistId: String!, itemId: String!): Boolean!
	"""
	Sets who can open a playlist: `visibility`, or the older `isPublic` boolean. Owner only.
	Narrowing it narrows who can edit it too.
	"""
	updatePlaylistVisibility(playlistId: String!, isPublic: Boolean, visibility: PlaylistVisibility): Boolean!
	"""
	Deletes a playlist. Followers are told it is gone, with no revision.
	"""
	deletePlaylist(playlistId: String!): Boolean!
	"""
	Imports a public playlist, album, or track from Spotify, Deezer, Apple Music, or YouTube
	and saves it as an Agro playlist.
	"""
	importExternalPlaylist(url: String!, titleOverride: String, isPublic: Boolean, visibility: PlaylistVisibility): PlaylistPayload!
	"""
	Applies `edits` in order, all or none, provided the playlist is still at `baseRevision`.
	Otherwise fails with `extensions.code = "STALE_REVISION"` and `currentRevision`.
	"""
	applyPlaylistEdits(playlistId: String!, baseRevision: Int!, edits: [PlaylistEditInput!]!): PlaylistPayload!
	"""
	Renames a playlist or rewrites its description. Owner only, revision-checked.
	"""
	updatePlaylistDetails(playlistId: String!, baseRevision: Int!, title: String!, description: String): PlaylistPayload!
	"""
	Sets who besides the owner may edit. Narrowed to what the visibility allows; the answer
	says what was actually stored.
	"""
	updatePlaylistEditAccess(playlistId: String!, editAccess: EditAccess!): EditAccess!
	"""
	Starts following a playlist the caller may open, and answers it. Following one's own
	playlist is allowed and changes nothing an owner would notice.
	"""
	followPlaylist(id: String!): PlaylistPayload!
	unfollowPlaylist(id: String!): Boolean!
	"""
	Publishes one embedding, merging it into an existing recording if it matches one.
	
	Returns the recording id the audio now sits under, which may be one another client
	created: that is the whole point, and it is how two encodings of one performance stop
	being two recordings.
	"""
	publishRecording(embedding: String!, dim: Int!, model: String!, version: Int!, durationMs: Int!, title: String, artist: String, album: String, sourceUri: String, lyrics: String = null, lyricsSource: String = null): String!
	"""
	Publishes a batch of embeddings, answering for each in turn.
	
	One request instead of one per recording. A client that has just measured its library has
	hundreds to file, and each was a separate round trip — on a phone, a separate wake of the
	radio.
	
	Each entry is matched and merged exactly as [`Self::publish_recording`] does, one at a time
	and each under its own lock. The batch is not a transaction: holding the database for the
	length of twenty sequence comparisons would stall every other request on the server, and a
	half-applied batch is not a problem here — an entry that did not land is republished on the
	next sync, and re-publishing one that did is what the catalogue already handles by merging.
	"""
	publishRecordings(entries: [PublishRecordingInput!]!): [PublishResult!]!
	"""
	Follows an artist, creating the row for them if the catalogue has never seen the name.
	
	Returns null for a name that normalises to nothing — punctuation, whitespace — rather than
	erroring: there is no artist to have followed, and nothing went wrong.
	"""
	subscribeArtist(userId: String!, artist: String!, externalId: String): ArtistSubscription
	"""
	Unfollows. False when there was nothing to unfollow, which is not an error either.
	"""
	unsubscribeArtist(userId: String!, artistId: String!): Boolean!
	"""
	Adds a batch of plays to today's counters. Returns how many entries were counted.
	
	Takes no `userId`, unlike `recordScrobbles` next door, and that difference is the feature:
	scrobbles are the caller's own history and are theirs to read and purge, while these are
	contributions to a shared total that nothing can attribute afterwards. The authenticated
	account is checked here and then deliberately discarded — it is never passed to the store.
	
	Not idempotent, and cannot be: a repeated submission is indistinguishable from listening to
	something twice, precisely because nothing identifies the submitter. Clients must therefore
	clear their pending counts on success and accept losing a batch on a failed request. Losing
	a few counts costs a shelf a little accuracy; the alternative is a per-client submission id,
	which is an identifier, which is the one thing this table must not hold.
	"""
	submitPlayCounts(entries: [PlayCountInput!]!): Int!
	"""
	Contributes measured vectors. Returns how many entries were folded in.
	
	Takes no `userId`, like `submitPlayCounts` next door and for the same reason: these are
	contributions to a shared average that nothing can attribute afterwards. The authenticated
	account is checked here and then discarded — it is never passed to the store.
	
	Re-submitting is harmless rather than idempotent. A repeat is one more observation of the
	same recording, which moves a settled average by very little and stops moving it at all
	past `MAX_OBSERVATIONS`; a submission id to make it exactly idempotent would be an
	identifier, which is the one thing this table must not hold.
	"""
	submitAcousticVectors(entries: [AcousticVectorInput!]!): Int!
}

type NodePayload {
	deviceId: String!
	userId: String!
	petname: String!
	clientType: String!
	lanAddress: String
	"""
	The *client's* version, as the client reported it. Echoed back, never set here.
	"""
	version: String
	currentTrack: String
	lastSeenAt: String!
	isOnline: Boolean!
	"""
	This server's version.
	
	Distinct from [`version`], which is whatever the client said about itself. Nothing here
	described the server at all before, so a client had no way to find out what it was talking
	to except by trying something and reading the error.
	"""
	serverVersion: String!
	"""
	What this server can do that an older one could not.
	
	Named rather than inferred from [`server_version`]: a client that has to map version
	numbers to features carries a table that goes stale, and a fork or a partial deployment
	makes the mapping wrong anyway. A client looks for the name it needs and falls back when it
	is missing.
	"""
	capabilities: [String!]!
}

"""
Everything a newly created account needs, shown exactly once.
A scannable pairing payload, shown once.
"""
type PairingPayload {
	qrData: String!
	token: String!
	label: String!
}

type PeerSourcePayload {
	deviceId: String!
	petname: String!
	lanAddress: String
	isOnline: Boolean!
	isServerArchive: Boolean!
}

"""
One recording's plays since the client last reported.
