"""
An account as its owner sees it.

Carries **no credential**. It used to return `apiKey` and `passphrase` in cleartext, which meant
a revocable device token could be traded for the permanent account passphrase just by asking —
the escalation that made revoking a device pointless. A credential is shown once, by the
mutation that mints it, and never again.
"""
type AccountPayload {
	id: String!
	username: String!
	role: String!
	state: String!
	quotaBytes: Int!
	canArchive: Boolean!
	connectionUrl: String!
}

"""
One recording's measured vector.

All six axes are `0..1`, except the key pair which is `-1..1`. Out-of-range values are clamped
rather than rejected: a batch is a background contribution, and failing the whole request over
one bad row would lose the good ones with it.
"""
input AcousticVectorInput {
	title: String!
	artist: String!
	tempo: Float!
	energy: Float!
	brightness: Float!
	danceability: Float!
	keyX: Float!
	keyY: Float!
}

input AddEditInput {
	track: PlaylistTrackInput!
	"""
	Inserted after this item; at the end when absent.
	"""
	afterItemId: String
}

type AgroPlugin {
	id: String!
	name: String!
	description: String!
	version: String!
	category: String!
	target: String!
	isEnabled: Boolean!
	isConnected: Boolean!
	"""
	Whether an admin can switch it. The client connectors describe what is connected; there is
	nothing on the server to turn off, so offering a switch would be offering a fake one.
	"""
	toggleable: Boolean!
	latencyMs: Int
	endpoint: String
	metadata: [PluginMetaItem!]!
}

type AgroWrappedPayload {
	year: Int!
	month: Int
	totalMinutes: Int!
	totalPlays: Int!
	topArtists: [StatEntry!]!
	topTracks: [StatEntry!]!
	topAlbums: [StatEntry!]!
	topGenres: [StatEntry!]!
	topHourUtc: Int
	"""
	The peak hour in the caller's own offset. `null` when there were no plays at all.
	"""
	topHourLocal: Int
	"""
	The longest run of *consecutive* days with a play.
	"""
	longestStreakDays: Int!
	"""
	Days with any play at all, which is a different and usually much larger number.
	"""
	activeDaysCount: Int!
	newArtistsCount: Int!
	"""
	Distinct artists in the period. `topArtists` is a top ten, so its length says nothing.
	"""
	totalArtists: Int!
	"""
	Plays per calendar month, January first. Always twelve entries.
	"""
	byMonth: [Int!]!
	"""
	Plays per hour of the caller's local day, index 0 = midnight. Always twenty-four entries.
	"""
	byHour: [Int!]!
	"""
	Plays per device, most-played first. The one figure only a fleet-wide server can answer.
	"""
	byDevice: [StatEntry!]!
	firstPlay: String
	lastPlay: String
}

type AnthemPayload {
	title: String!
	artist: String!
	"""
	Plays across the whole circle.
	"""
	plays: Int!
	"""
	Who played it, and how often each. The interesting half of an anthem.
	"""
	byMember: [StatEntry!]!
}

"""
An app password as it is listed back. The token itself is deliberately absent: a credential is
shown once, when it is created, and is not recoverable afterwards.
"""
type AppPassword {
	"""
	Stable handle for this one credential. Labels repeat; this does not.
	"""
	id: Int!
	label: String!
	createdAt: String!
	lastUsedAt: String
}

"""
The one time a token is returned. Shown once, at creation.
"""
type AppPasswordCreated {
	label: String!
	token: String!
}

"""
Something a subscribed artist has put out since the client last looked.
"""
type ArtistRelease {
	recordingId: String!
	artistId: String!
	artist: String!
	title: String
	album: String
	"""
	The catalogue position this was published at. The highest one seen is the next watermark.
	"""
	updatedAt: Int!
}

"""
An artist somebody can subscribe to.
"""
type ArtistSubscription {
	artistId: String!
	"""
	The spelling to show — the first one the catalogue saw.
	"""
	displayName: String!
	"""
	What the name normalises to. The identity two spellings share; exposed so a client can tell
	that the artist it is looking at is one it already follows without asking again.
	"""
	normName: String!
	"""
	A namespaced id at the source it came from, such as `ytm:UC…`, when one is known.
	"""
	externalId: String
}

type BlendMemberPayload {
	username: String!
	"""
	False while they have been asked and not yet answered.
	"""
	joined: Boolean!
}

type BlendPayload {
	playlistId: String!
	title: String!
	createdBy: String!
	isCreator: Boolean!
	members: [BlendMemberPayload!]!
	size: Int!
	mix: Int!
	window: BlendWindow!
	refresh: BlendRefresh!
	refreshedAt: String
	"""
	When it rewrites itself next. Absent when frozen or not written yet.
	"""
	nextRefreshAt: String
}

"""
How often it is written again on its own.
"""
enum BlendRefresh {
	DAILY
	WEEKLY
	"""
	Only when someone joins or leaves, or the recipe changes.
	"""
	FROZEN
}

"""
How far back a member's listening is read.
"""
enum BlendWindow {
	FOUR_WEEKS
	SIX_MONTHS
	ALL_TIME
}

"""
One recording as the catalogue knows it, on its way to a client.
"""
type CatalogEntry {
	recordingId: String!
	"""
	The embedding, hex-encoded int8. Clients compare it themselves rather than trusting the
	server's match — the same audio has to look the same to both ends or a pull is worthless.
	"""
	embedding: String!
	"""
	Values per vector, so a client can split the blob into segments.
	"""
	dim: Int!
	"""
	Which embedder produced it. A client ignores an entry from a model it does not run.
	"""
	model: String!
	version: Int!
	durationMs: Int!
	title: String
	artist: String
	album: String
	lyrics: String
	"""
	What supplied [`lyrics`] — `LRCLIB`, `Native`, and so on.
	
	Null for anything published before the catalogue recorded this, which cannot be filled in
	after the fact: the row remembers the text, not who sent it. A client that cares where its
	lyrics came from can decide what to do with an unattributed one.
	"""
	lyricsSource: String
	"""
	Namespaced ids known to hold this audio — `ytm:…`, `navidrome:…`. Never a `local:` id:
	those are filesystem paths from somebody's phone, and this list goes to every account.
	"""
	sources: [String!]!
	"""
	This entry's position in the catalogue's order. The highest one seen is the next cursor.
	"""
	updatedAt: Int!
}

type CircleRecapPayload {
	"""
	Echoed back, because a client that asked for `MONTH` and a server that defaulted to `WEEK`
	would otherwise disagree silently.
	"""
	period: String!
	"""
	Who is actually in it. Friends who have their statistics closed are absent, not listed
	empty — being in someone's recap is a thing you opt into.
	"""
	members: [String!]!
	anthem: AnthemPayload
	topTracks: [StatEntry!]!
	topArtists: [StatEntry!]!
	trendsetter: TrendsetterPayload
	matrix: [TasteMatrixEntry!]!
}

"""
The outcome of deleting a link.
"""
type DeleteLinkPayload {
	deleted: Boolean!
	"""
	True when the link pointed at a Subsonic-server share that Agro cannot revoke on the user's
	behalf.
	
	Agro holds a music-server address and username but deliberately never the password — see the
	encrypted fields on `synced_settings`, and the "the password stays on each device" rule the
	clients are built around. Revoking a share needs that password, so the honest answer is to
	remove Agro's own record and say plainly that the share still exists on the music server,
	rather than to start storing a credential the whole design avoids.
	
	The field keeps its original name: renaming it would break clients already in use.
	"""
	navidromeCleanupRequired: Boolean!
}

"""
One sealed copy of a note, as the client sends and reads it.
"""
input DeviceCiphertextInput {
	deviceId: String!
	ciphertext: String!
}

"""
One sealed copy of a note, as the client sends and reads it.
"""
type DeviceCiphertextPayload {
	deviceId: String!
	ciphertext: String!
}

"""
One device's published identity key.

The device id is opaque to the server and meaningful only within the account — it exists so a
sender can seal one copy per device and a device can recognise its own copy on the way back.
"""
type DeviceKeyPayload {
	deviceId: String!
	publicKey: String!
}

type DropPayload {
	id: String!
	fromUser: String!
	toUser: String!
	trackTitle: String!
	artistName: String!
	albumName: String
	artworkUrl: String
	"""
	Present when the sender's copy is in this server's index, so a client can offer to fetch the
	file rather than only naming it.
	"""
	contentHash: String
	trackUri: String
	note: String
	"""
	The recipient's sealed copy, duplicated out of `noteCiphertexts`.
	
	Kept for clients that predate the per-device list. A client that understands
	`noteCiphertexts` should read that instead — this field cannot carry the sender's own copy.
	"""
	noteCiphertext: String
	"""
	Every sealed copy of the note, by device — the recipient's devices and the sender's own.
	"""
	noteCiphertexts: [DeviceCiphertextPayload!]!
	isEncrypted: Boolean!
	createdAt: String!
	"""
	Null while unread. Only ever populated on the recipient's own view; see `sentDrops`.
	"""
	readAt: String
	archived: Boolean!
	"""
	The recipient's one-emoji reply, or null if they have not reacted.
	
	Unlike `read_at`, this *is* shown to the sender. A read receipt is something the server
	observed about the recipient; a reaction is something they chose to send back.
	"""
	reaction: String
}

enum EditAccess {
	OFF
	FRIENDS
	PUBLIC
}

"""
An identity provider account linked to an Agro account.
"""
type FederatedIdentity {
	issuer: String!
	"""
	The provider's stable identifier for the person. The only value treated as identity.
	"""
	subject: String!
	linkedAt: String!
}

type FeedItemPayload {
	username: String!
	"""
	RFC3339, from the play that caused it — not the time this was read.
	"""
	at: String!
	"""
	`MILESTONE`, `ON_REPEAT` or `NEW_FAVOURITE`. A discriminator rather than a union, so a
	client that meets a kind it does not know can still render the summary line.
	"""
	kind: String!
	"""
	A ready-made sentence. Sent so that every client says the same thing rather than each
	reimplementing the phrasing and disagreeing about it.
	"""
	summary: String!
	artist: String!
	title: String
	"""
	Plays for a milestone or a repeat; distinct tracks for a new favourite.
	"""
	count: Int!
}

type FollowedPlaylists {
	"""
	The followed playlists the caller can still open.
	"""
	playlists: [PlaylistPayload!]!
	"""
	Followed playlists the caller can no longer open: made private, or a friendship ended. A
	deleted playlist is in neither list.
	"""
	revokedIds: [String!]!
}

"""
A friend code as a client renders it.

[`ttl_seconds`] is sent rather than left for the client to derive from [`expires_at`], because
the client's clock is not the server's and a QR panel that re-mints on a drifting timer would
either show a dead code or thrash. It counts down from *now* on the device that asked.
"""
type FriendCodePayload {
	code: String!
	expiresAt: String!
	ttlSeconds: Int!
}

type FriendEdgePayload {
	profile: ProfilePayload!
	nowPlaying: FriendNowPlaying
}

"""
A friend's jam, as it appears before you are in it.

Deliberately thin: the code is not here, and neither is the queue. Being able to see that a
friend has a jam open is not the same as being in it.
"""
type FriendJamPayload {
	id: String!
	host: String!
	mode: String!
	members: [String!]!
	"""
	What they are playing, so it is worth deciding about.
	"""
	nowPlayingTitle: String
}

"""
What a friend is playing, projected from the one handoff row their account already keeps.

Presence needs no storage of its own: the handoff a device publishes so its *owner* can pick a
session up elsewhere is the same fact a friend is being shown.
"""
type FriendNowPlaying {
	username: String!
	trackUri: String!
	trackTitle: String!
	artistName: String!
	albumName: String
	artworkUrl: String
	positionMs: Int!
	isPlaying: Boolean!
	updatedAt: String!
	"""
	Which of the host's devices is playing it.
	
	A listener needs this to ask for the audio at all: both the direct transfer and the relay
	address one device, not an account.
	"""
	deviceId: String!
	"""
	SHA-256 of the file the host is playing, when they have one. `None` for anything streamed,
	which is what sends a listener back to matching by name.
	"""
	contentHash: String
	"""
	Where to reach the host's device directly, and the token to present when doing so.
	
	Both are `Some` only when the two devices look like they share a local network *and* the
	viewer is allowed to see this account at all. Neither is the authorisation on its own — see
	[`crate::ws::WsHub::same_network`] for why the address is a hint and the token is the gate.
	"""
	peerLanAddress: String
	peerLanToken: String
	"""
	This session's real metadata, sealed to the asking device's key.
	
	Pairwise, like the two fields above, and for a stronger reason: a copy is sealed to one
	device's public key, so handing it to anyone else is handing over bytes they cannot open.
	`None` whenever the question was asked without naming a device, when the host sealed
	nothing, or when the host has not sealed anything to *this* device yet — a friend who has
	published no key, or a device added since the last track change.
	
	When this is set, the plaintext `track_title` and `artist_name` above are a placeholder and
	the viewer is expected to open this instead. The server cannot tell the difference; it has
	never held the key.
	"""
	encryptedPresence: String
}

input HandoffInput {
	userId: String!
	"""
	Optional so an older client is still a valid sender; omitted reads as "did not say", which
	leaves whatever length is already stored alone.
	"""
	durationMs: Int
	trackUri: String!
	trackTitle: String!
	artistName: String!
	albumName: String
	artworkUrl: String
	positionMs: Int!
	isPlaying: Boolean!
	deviceId: String!
	"""
	Optional so a heartbeat can refresh position without re-sending the whole queue; when it is
	omitted the stored queue is kept as-is.
	"""
	queue: [HandoffTrackInput!]
	queueIndex: Int
	"""
	SHA-256 of the file being played, when this device has one and has hashed it.
	
	Optional for the same reason `duration_ms` is: an older client is still a valid sender, and
	omitting it leaves whatever hash the track change already established alone rather than
	erasing it on every heartbeat.
	"""
	contentHash: String
	"""
	End-to-end encrypted envelope containing sealed metadata (track_uri, title, artist, album).
	When present, Agro acts purely as a blind forwarder over WebSocket without logging or learning the music.
	"""
	encryptedPayload: String
	"""
	The same session sealed once per friend device, so friends can still see it.
	
	`encrypted_payload` is sealed to this account's own vault key and no friend can open it, so
	a sealed session showed up in the social feed as a placeholder. These are the copies that
	fix that: one per device key published by a friend, each openable only by that device.
	
	Three states, and they are not interchangeable. Omitted means *leave the stored copies
	alone* — a heartbeat repeats metadata that has not changed, and re-sealing it per device
	ten times a minute is work with no result. Empty means *drop them*: the session ended, or
	stopped being sealed. Non-empty replaces the set, which is what a track change sends.
	"""
	presenceCiphertexts: [PresenceCiphertextInput!]
}

type HandoffState {
	trackUri: String!
	"""
	How long the track is. 0 when the sender did not say, or when it is a livestream — both
	want a running clock rather than a progress bar that finishes at the wrong moment.
	"""
	durationMs: Int!
	trackTitle: String!
	artistName: String!
	albumName: String
	artworkUrl: String
	positionMs: Int!
	isPlaying: Boolean!
	deviceId: String!
	updatedAt: String!
	"""
	The rest of the session: every track in the queue, so picking it up on another device
	continues the listening rather than playing one song and stopping.
	"""
	queue: [HandoffTrack!]!
	"""
	Where `queue` was playing. -1 when the sender reported no queue at all.
	"""
	queueIndex: Int!
	"""
	Present only for a sealed session: an authenticated envelope the server forwards without
	opening. A client with the account's vault key unseals the real metadata; everything else
	shows the session as private.
	"""
	encryptedPayload: String
}

"""
One entry of a handed-over queue. `track_uri` is the sending client's own id for it — a
receiving client resolves it against its own backends, falling back to title and artist when
the two devices do not share that source.
"""
type HandoffTrack {
	trackUri: String!
	trackTitle: String!
	artistName: String!
	albumName: String
	artworkUrl: String
}

input HandoffTrackInput {
	trackUri: String!
	trackTitle: String!
	artistName: String!
	albumName: String
	artworkUrl: String
}

"""
What a device reports it holds. Metadata travels with it so the server can index a file it has
never been sent — an index-only library still answers "who has what".
"""
input HoldingInput {
	contentHash: String!
	title: String!
	artist: String!
	album: String
	albumArtist: String
	trackNo: Int
	discNo: Int
	year: Int
	genre: String
	durationMs: Int!
	sizeBytes: Int!
	format: String
	bitrateKbps: Int
	"""
	The device's own handle for the file. Stored opaquely and never interpreted.
	"""
	localRef: String
}

type InvitePayload {
	code: String!
	createdBy: String!
	createdAt: String!
	expiresAt: String
	maxUses: Int!
	usedCount: Int!
	revoked: Boolean!
}

"""
The one thing the whole room is hearing.
"""
type JamNowPlayingPayload {
	trackId: String!
	title: String!
	artist: String!
	artworkUrl: String
	durationMs: Int!
	startedAt: String!
	"""
	How far in the room is *now*, worked out here from `started_at`. A client seeks to this
	rather than starting from zero, which is what lets somebody join late and land in step.
	"""
	positionMs: Int!
	"""
	The member who queued it, the device of theirs that holds it, and the bytes it names.
	
	`content_hash` is `None` for anything queued from a streaming source, which is what sends
	the rest of the room back to matching the track by name.
	"""
	addedBy: String!
	deviceId: String
	contentHash: String
	"""
	Where to reach that device on this network, and the token to present. Set only when the
	server judged the two devices to share one — see [`crate::ws::WsHub::same_network`].
	"""
	peerLanAddress: String
	peerLanToken: String
	"""
	Votes to skip this track so far.
	"""
	skipVotes: Int!
	"""
	How many are needed. More than half the room, everybody counted.
	"""
	skipsNeeded: Int!
	"""
	Whether *you* have voted to skip it, so the control shows its state.
	"""
	youSkipped: Boolean!
}

type JamPayload {
	id: String!
	"""
	What you give someone so they can join. Shown to members only.
	"""
	code: String!
	host: String!
	"""
	`open` or `democracy`.
	"""
	mode: String!
	isHost: Boolean!
	members: [String!]!
	"""
	Accepted tracks, in the order they were added.
	"""
	queue: [JamTrackPayload!]!
	"""
	Suggested tracks the room has not accepted yet. Always empty in `open` mode.
	"""
	proposals: [JamTrackPayload!]!
	"""
	What everyone is hearing, or null between tracks.
	"""
	nowPlaying: JamNowPlayingPayload
	"""
	Approvals a suggestion needs here, so the UI can say "2 to go" without guessing.
	"""
	approvalsNeeded: Int!
	"""
	`code` or `friends` — who can find this jam without being handed the code.
	"""
	visibility: String!
}

type JamRecap {
	startedAt: String!
	endedAt: String!
	"""
	Wall-clock time the reader spent in the room, not the sum of track lengths: a skipped track
	did not last its duration.
	"""
	durationMs: Int!
	"""
	Everyone who was in the room or put something in it, sorted.
	"""
	people: [String!]!
	"""
	In the order they played.
	"""
	tracks: [RecapTrack!]!
	tracksOmitted: Int!
	topContributor: RecapContributor
	"""
	The played track with the most approvals. `None` when nothing was approved by anyone.
	"""
	mostLoved: RecapTrack
	"""
	The played track with the most skip votes. `None` when nobody voted to skip anything.
	"""
	mostSkipped: RecapTrack
}

type JamRecapPayload {
	id: String!
	createdAt: String!
	recap: JamRecap!
}

type JamTrackPayload {
	id: String!
	addedBy: String!
	trackUri: String!
	title: String!
	artist: String!
	artworkUrl: String
	durationMs: Int!
	"""
	Approvals so far, excluding the person who suggested it.
	"""
	approvals: Int!
	"""
	Whether *you* have approved it, so the control can show its state.
	"""
	approved: Boolean!
	"""
	How many more approvals it needs. Sent rather than derived, so a client never has to
	reimplement the rule and disagree with the server about it.
	"""
	stillNeeded: Int!
}

