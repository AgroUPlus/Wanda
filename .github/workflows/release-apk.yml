name: Build and attach release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write local.properties
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          cat >> local.properties <<EOF
          releaseStoreFile=${{ github.workspace }}/release.keystore
          releaseStorePassword=$RELEASE_STORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      # The R8 mapping is the only way to read a stack trace from this exact build; a local
      # rebuild of the same commit does not reproduce it.
      - name: Compress R8 mapping
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gzip -c app/build/outputs/mapping/release/mapping.txt > "mapping-${TAG_NAME}.txt.gz"

      # Tags are already "vX.Y.Z", so the asset reads "Wanda-vX.Y.Z.apk".
      - name: Rename APK
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: mv app/build/outputs/apk/release/app-release.apk "Wanda-${TAG_NAME}.apk"

      # The keystore and its passwords are not needed past the build, so they are gone before
      # any third-party code runs. The always() step below still covers a failed build.
      - name: Remove signing material before upload
        run: rm -f release.keystore local.properties

      - name: Upload APK and mapping to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            Wanda-*.apk
            mapping-*.txt.gz


      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore local.properties
