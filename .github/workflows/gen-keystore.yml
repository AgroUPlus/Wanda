name: (temporary) Generate release keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        default: "wanda-release"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore with a random password
        run: |
          PASSWORD=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore wanda-release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Wanda, OU=Wanda, O=Wanda, L=Unknown, ST=Unknown, C=US"
          echo "$PASSWORD" > password.txt
          set +x

      - name: Upload keystore + password as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            wanda-release.keystore
            password.txt
          retention-days: 1
