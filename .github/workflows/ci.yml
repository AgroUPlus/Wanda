name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

  commit-lint:
    name: Lint Commits & CLA Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify No Forbidden AI Trailers
        run: |
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%H")
          for COMMIT in $COMMITS; do
            MSG=$(git log -1 --pretty=format:"%B" $COMMIT)
            if echo "$MSG" | grep -Eiq "(Co-Authored-By:.*(claude|anthropic|chatgpt|openai|copilot|gemini|deepseek|qwen|ai\b)|generated by (claude|chatgpt|copilot|ai\b))"; then
              echo "::error::Commit $COMMIT contains forbidden AI co-authorship trailer per CLA.md Section 8."
              exit 1
            fi
          done
          echo "All PR commits comply with CLA Section 8."

