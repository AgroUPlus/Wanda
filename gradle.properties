org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.overridePathCheck=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 ships its own Kotlin support, but KSP is not compatible with it yet, and Room and Hilt
# both need KSP. So we opt back out to the standalone Kotlin plugin, which in turn requires the
# pre-9 DSL. Both flags are deprecated and should be dropped once KSP supports built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
