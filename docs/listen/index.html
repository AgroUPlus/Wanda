<!doctype html>
<!--
  The page behind a custom share domain — host this at https://<your-domain>/listen/.

  Wanda rewrites share links to https://<your-domain>/listen?v=<youtube-id> for YouTube Music
  tracks and ?u=<encoded-url> for everything else it is allowed to carry. This page turns one back
  into the real link.

  Two rules it does not break:

  1. It forwards only to hosts in ALLOWED_HOSTS. A redirector that forwards anywhere is an open
     redirect — a phishing URL wearing your domain, with your domain's reputation paying for it.
     Add your own Navidrome host below; nothing else needs adding.
  2. It is static. No analytics, no logging, no cookies, no third-party requests. A shortener is a
     redirect log by construction, and the point of Wanda is that nobody keeps one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening…</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf8ff;
    --surface: #ffffff;
    --text: #1c1b1f;
    --muted: #49454f;
    --accent: #6750a4;
    --on-accent: #ffffff;
    --border: #e7e0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316;
      --surface: #1e1e22;
      --text: #e6e1e9;
      --muted: #cac4d0;
      --accent: #d0bcff;
      --on-accent: #381e72;
      --border: #2c2c31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 28px;
    text-align: center;
  }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; word-break: break-word; }
  a.button {
    display: block;
    padding: 14px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 10px;
    background: var(--accent);
    color: var(--on-accent);
  }
  a.button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
  }
  code { font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="heading">Opening…</h1>
  <p id="detail">Taking you to the track.</p>
  <div id="actions"></div>
</main>
<script>
(function () {
  // Your own music server goes here, e.g. "music.example.com". YouTube's hosts are the ones Wanda
  // can mint links for; anything absent from this list is refused rather than forwarded.
  var ALLOWED_HOSTS = [
    "music.youtube.com",
    "youtube.com",
    "www.youtube.com",
    "youtu.be"
  ];

  var params = new URLSearchParams(location.search);
  var heading = document.getElementById("heading");
  var detail = document.getElementById("detail");
  var actions = document.getElementById("actions");

  function refuse(message) {
    document.title = "Nothing to open";
    heading.textContent = "Nothing to open";
    detail.textContent = message;
  }

  function button(label, href, secondary) {
    var a = document.createElement("a");
    a.className = secondary ? "button secondary" : "button";
    a.textContent = label;
    a.href = href;
    a.rel = "noreferrer";
    actions.appendChild(a);
    return a;
  }

  // A YouTube id is a fixed 11 characters of URL-safe base64. Checking it here is what stops a
  // decorated value from being pasted straight into a URL.
  var videoId = params.get("v");
  var target = null;
  if (videoId && /^[A-Za-z0-9_-]{11}$/.test(videoId)) {
    target = "https://music.youtube.com/watch?v=" + videoId;
  } else if (params.get("u")) {
    var parsed;
    try { parsed = new URL(params.get("u")); } catch (e) { parsed = null; }
    if (parsed && parsed.protocol === "https:" && ALLOWED_HOSTS.indexOf(parsed.hostname) !== -1) {
      target = parsed.href;
    } else {
      refuse("That link points somewhere this page will not forward to.");
      return;
    }
  }

  if (!target) {
    refuse("This link is missing the track it was meant to carry.");
    return;
  }

  detail.textContent = target;
  // The app scheme rather than the https link: a share domain is set per install, so Wanda cannot
  // claim it in the manifest, and this is how it gets the tap instead.
  button("Open in Wanda", "wanda://listen" + location.search);
  var web = button("Open in the browser", target, true);

  // Short, and after the buttons exist: someone with the app installed gets a moment to reach for
  // it, and everyone else is on their way without having to press anything.
  setTimeout(function () { location.replace(web.href); }, 1200);
})();
</script>
</body>
</html>
